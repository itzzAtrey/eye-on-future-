<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClipVault</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #0b0b0f;
    color: white;
}

/* HEADER */
header {
    padding: 20px;
    background: #111118;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid #25252e;
}

.logo {
    font-size: 26px;
    font-weight: bold;
}

.logo span {
    color: #7c5cff;
}

.search {
    margin-top: 15px;
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: #202027;
    color: white;
    font-size: 15px;
}

/* NAVIGATION */
nav {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 15px 20px;
    background: #111118;
}

nav button {
    border: none;
    background: #202027;
    color: white;
    padding: 10px 17px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
}

nav button.active {
    background: #7c5cff;
}

/* MAIN */
.container {
    padding: 20px;
    max-width: 1200px;
    margin: auto;
}

.section-title {
    margin-bottom: 18px;
    font-size: 23px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px;
}

/* CARD */
.card {
    background: #15151c;
    border: 1px solid #24242d;
    border-radius: 14px;
    overflow: hidden;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-4px);
    border-color: #7c5cff;
}

/* PREVIEW */
.preview {
    height: 145px;

    background:
        linear-gradient(
            135deg,
            #30205e,
            #111
        );

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 48px;
}

/* CONTENT */
.card-content {
    padding: 14px;
}
